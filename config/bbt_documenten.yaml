# Register van Beleids- en Begrotingstoelichtingen (BBT) — Vlaams Parlement.
# Geverifieerd op 2026-10-01 via de documentfiches (ws.vlpar.be/e/opendata/pi/<id>) en dossierpagina's.
# PDF: https://docs.vlaamsparlement.be/files/pfile?id=<pfile_id>
# Documentpagina: https://www.vlaamsparlement.be/nl/parlementaire-documenten/parlementaire-initiatieven/<doc_id>
#
# fase: BO = begrotingsopmaak (okt/nov vorig jaar), BA = begrotingsaanpassing (enkel 2020: reeks 17-A;
#       vanaf 2023 niet meer vereist), UITV = begrotingsuitvoering (stuk 23-x, mei volgend jaar).
# Opmerking: de letter per beleidsveld wisselt per zittingsjaar — nooit hardcoderen, altijd dit register gebruiken.

beleidsdomeinen:
  WVG:
    naam: "Welzijn, Volksgezondheid en Gezin (2024-2025: + Armoedebestrijding; 2025-2026: 'Welzijn en Armoedebestrijding')"
    programma_prefix: G
    # Programma + ISE-letter uit de artikelcode (bv. GB0-1GGF2RX-IS -> GG-R), empirisch afgeleid uit 2020-2026.
    # De parser gebruikt dit om artikelregels betrouwbaar aan een ISE toe te wijzen (koppen in de PDF zijn soms onvolledig).
    ise_codes:
      GG-R: "PERSONEN MET EEN BEPERKING"
      GE-M: "JEUGDHULP"
      GE-U: "GEINTEGREERD GEZINSBELEID"
      GE-Q: "GROEIPAKKET"
      GD-K: "WOONZORG EN EERSTE LIJN"
      GD-L: "GESPECIALISEERDE ZORG"
      GD-J: "PREVENTIE"
      GD-I: "ALGEMEEN GEZONDHEIDSBELEID"
      GC-B: "BELEIDSONDERSTEUNING"
      GC-C: "ARMOEDEBELEID"
      GC-E: "WELZIJNSWERK"
      GC-F: "SOCIALE AKKOORDEN (VIA)"
      GC-J: "PREVENTIE"              # vanaf BO 2026 (beleidsveld Zorg)
      GC-K: "EERSTELIJN"             # vanaf BO 2026
      GC-L: "GESPECIALISEERDE ZORG"  # vanaf BO 2026
      GC-V: "WOONZORG"               # vanaf BO 2026
      GH-T: "SOCIALE BESCHERMING"
      GH-W: "ALGEMEEN BELEID SOCIALE BESCHERMING"
      GI-S: "ZORGINFRASTRUCTUUR"
      GA-Z: "APPARAAT / THEMA-OVERSCHRIJDEND"
    ise_relevant_voor_wachtlijsten:
      - "PERSONEN MET EEN BEPERKING"      # vaph-pvb (programma GG)
      - "JEUGDHULP"                        # opgroeien-nrtj (GE)
      - "GEINTEGREERD GEZINSBELEID"        # opgroeien-kinderopvang (GE)
      - "WOONZORG"                         # zorg-woonzorgcentra (GD; t/m 2025 'WOONZORG EN EERSTE LIJN')
      - "SOCIALE BESCHERMING"              # vsb-zorgbudget (GH)
      - "GESPECIALISEERDE ZORG"            # zorg-cgg (GD)
  WONEN:
    naam: "Wonen (beleidsveld binnen Omgeving; commissie Wonen)"
    programma_prefix: Q
    ise_codes:
      QD-P: "VRAAGZIJDE WONINGMARKT"
      QD-Q: "AANBODZIJDE WONINGMARKT"
      QD-R: "WONINGKWALITEIT"
      QD-T: "THEMA-OVERSCHRIJDEND INSTRUMENTARIUM WONEN"
      QA-Z: "APPARAAT / THEMA-OVERSCHRIJDEND"
    ise_relevant_voor_wachtlijsten:
      - "AANBODZIJDE WONINGMARKT"          # wonen-sociale-huur (QD; VMSW/Wonen in Vlaanderen)
      - "VRAAGZIJDE WONINGMARKT"           # wonen-huurpremie (QD; huursubsidie/-premie)

